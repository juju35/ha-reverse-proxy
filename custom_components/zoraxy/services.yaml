toggle_proxy_rule:
  name: Toggle proxy rule
  description: Enable or disable a Zoraxy proxy rule.
  fields:
    domain:
      name: Domain
      description: The domain of the proxy rule (e.g. "example.com").
      required: true
      example: "example.com"
      selector:
        text:
    enable:
      name: Enable
      description: Set to true to enable the rule, false to disable it. Leave out to toggle the rule.
      required: false
      example: true
      selector:
        boolean:
    config_entry_id:
      name: Zoraxy instance
      description: The Zoraxy instance the rule belongs to. Leave out to use the instance that lists the domain.
      required: false
      selector:
        config_entry:
          integration: zoraxy
