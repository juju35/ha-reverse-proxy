name: Release

# On push to main, a release follows only a feat or fix commit (the squash-merge title, e.g.
# `fix: … (1.4.1) (#12)`) whose version has no tag yet; ci/docs/test/chore/refactor merges publish nothing.
# Run it by hand (Actions -> Release -> Run workflow, or `gh workflow run release.yml`) to publish other
# bumps. The notes gather the CHANGELOG.md sections of every version since the previous tag, and the
# release only follows a commit on which Lint, Validate and HACS Validation pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A commit is released only once Lint, Validate and HACS Validation pass on it.
  lint:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'feat') || startsWith(github.event.head_commit.message, 'fix') }}
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'feat') || startsWith(github.event.head_commit.message, 'fix') }}
    name: Validate
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  hacs:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'feat') || startsWith(github.event.head_commit.message, 'fix') }}
    name: HACS Validation
    uses: ./.github/workflows/hacs.yml
    permissions:
      contents: read

  release:
    needs: [lint, validate, hacs]
    # A manual run from another branch (a PR whose version is already bumped) must not publish
    # a release from an unmerged commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(jq -r .version custom_components/reverse_proxy/manifest.json)"
          grep -rq "REVERSE_PROXY_CARD_VERSION = '$VERSION'" src/reverse-proxy-card
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PREVIOUS="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          echo "previous=${PREVIOUS#v}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::v$VERSION is already released: merge a version bump first"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The frontend files are assembled from src/ (scripts/build-frontend.mjs); they are not committed.
      - name: Build the frontend
        uses: ./.github/actions/build-frontend
        if: steps.version.outputs.exists == 'false'

      # Only English stays in the frontend files of the zip; each other language is its own file next to them,
      # fetched when needed (scripts/split-frontend.mjs). The repository keeps every language in the sources.
      - name: Split the translations
        if: steps.version.outputs.exists == 'false'
        run: |
          node scripts/split-frontend.mjs

      - name: Build zip and notes
        if: steps.version.outputs.exists == 'false'
        run: |
          # AGENT.md is internal agent context: it has no business in what users install.
          (cd custom_components/reverse_proxy && zip -r ../../reverse_proxy.zip . -x "__pycache__/*" "AGENT.md")
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.previous }}" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: reverse_proxy.zip
          body_path: notes.md
          make_latest: true
